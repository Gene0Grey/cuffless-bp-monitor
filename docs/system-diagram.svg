<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aEcg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aI2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aPwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="aDat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>

  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
    <rect x="30" y="30" width="210" height="78" rx="8"/>
    <rect x="30" y="150" width="210" height="56" rx="8"/>
    <rect x="30" y="216" width="210" height="56" rx="8"/>
    <rect x="30" y="282" width="210" height="56" rx="8"/>
    <rect x="30" y="348" width="210" height="56" rx="8"/>
    <rect x="330" y="150" width="170" height="254" rx="8"/>
    <rect x="600" y="30" width="190" height="374" rx="8"/>
    <rect x="840" y="92" width="100" height="56" rx="8"/>
    <rect x="840" y="296" width="100" height="68" rx="8"/>
    <rect x="30" y="452" width="120" height="52" rx="8"/>
    <rect x="185" y="452" width="150" height="52" rx="8"/>
    <rect x="370" y="452" width="130" height="52" rx="8"/>
    <rect x="700" y="452" width="130" height="52" rx="8"/>
  </g>

  <g text-anchor="middle" fill="#0f172a" font-weight="600" font-size="15">
    <text x="135" y="64">AD8232 · ECG</text>
    <text x="135" y="174">PPG1 · MAX30102</text>
    <text x="135" y="240">PPG2 · MAX30102</text>
    <text x="135" y="306">PPG3 · MAX30102</text>
    <text x="135" y="372">PPG4 · MAX30102</text>
    <text x="415" y="262">TCA9548A</text>
    <text x="695" y="196">ESP32</text>
    <text x="890" y="117">PC</text>
    <text x="890" y="322">3V3 rail</text>
    <text x="90" y="476">LiPo 3.7 V</text>
    <text x="260" y="476">XL6009 boost</text>
    <text x="435" y="476">J1 · 5V IN</text>
    <text x="765" y="476">USB 5 V</text>
  </g>
  <g text-anchor="middle" fill="#475569" font-size="12">
    <text x="135" y="86">electrodes RA · LA · RL</text>
    <text x="135" y="194">fingertip · CH0</text>
    <text x="135" y="260">fingertip · CH1</text>
    <text x="135" y="326">earlobe · CH2</text>
    <text x="135" y="392">earlobe · CH3</text>
    <text x="415" y="282">I²C multiplexer</text>
    <text x="415" y="300">address 0x70</text>
    <text x="695" y="216">DevKit V1</text>
    <text x="695" y="248">200 Hz ECG sampling</text>
    <text x="695" y="266">PPG polled through the mux</text>
    <text x="695" y="284">digital filtering</text>
    <text x="890" y="136" font-size="11">Serial Plotter</text>
    <text x="890" y="341" font-size="11">TCA · PPG ×4</text>
    <text x="890" y="356" font-size="11">AD8232</text>
    <text x="90" y="494">1250 mAh</text>
    <text x="260" y="494">set to 5.0 V</text>
    <text x="435" y="494">JST-PH 2-pin</text>
    <text x="765" y="494">development</text>
  </g>

  <!-- ECG: analog, straight to the ESP32 -->
  <g stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#aEcg)">
    <line x1="240" y1="52" x2="598" y2="52"/>
    <line x1="240" y1="88" x2="598" y2="88"/>
  </g>
  <g text-anchor="middle" fill="#b91c1c" font-size="12">
    <text x="420" y="45">OUTPUT → GPIO34 (ADC1)</text>
    <text x="420" y="81">LO+ / LO− → GPIO32 / GPIO33</text>
  </g>

  <!-- I2C: sensors -> mux -> ESP32 -->
  <g stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#aI2c)">
    <line x1="240" y1="178" x2="328" y2="178"/>
    <line x1="240" y1="244" x2="328" y2="244"/>
    <line x1="240" y1="310" x2="328" y2="310"/>
    <line x1="240" y1="376" x2="328" y2="376"/>
    <line x1="500" y1="277" x2="598" y2="277"/>
  </g>
  <g text-anchor="middle" fill="#1d4ed8" font-size="11">
    <text x="285" y="172">SD0/SC0</text>
    <text x="285" y="238">SD1/SC1</text>
    <text x="285" y="304">SD2/SC2</text>
    <text x="285" y="370">SD3/SC3</text>
    <text x="550" y="270" font-size="12">I²C</text>
    <text x="550" y="293" font-size="12">GPIO21 / 22</text>
  </g>

  <!-- data out -->
  <line x1="790" y1="120" x2="838" y2="120" stroke="#475569" stroke-width="2.2" marker-end="url(#aDat)"/>
  <text x="815" y="112" text-anchor="middle" fill="#475569" font-size="11">USB</text>

  <!-- power -->
  <g stroke="#d97706" stroke-width="2.2" fill="none" marker-end="url(#aPwr)">
    <line x1="790" y1="330" x2="838" y2="330"/>
    <line x1="150" y1="478" x2="183" y2="478"/>
    <line x1="335" y1="478" x2="368" y2="478"/>
    <polyline points="500,478 650,478 650,406"/>
    <line x1="765" y1="452" x2="765" y2="406"/>
  </g>
  <g fill="#b45309" font-size="12">
    <text x="660" y="440">VIN</text>
    <text x="480" y="530" text-anchor="middle">Power from USB or J1 — never both at once.</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#334155" stroke-width="3">
    <line x1="30" y1="560" x2="56" y2="560" stroke="#dc2626"/><text x="64" y="564">ECG (analog)</text>
    <line x1="170" y1="560" x2="196" y2="560" stroke="#2563eb"/><text x="204" y="564">I²C</text>
    <line x1="250" y1="560" x2="276" y2="560" stroke="#d97706"/><text x="284" y="564">Power</text>
    <line x1="346" y1="560" x2="372" y2="560" stroke="#475569"/><text x="380" y="564">Data</text>
  </g>
</svg>
